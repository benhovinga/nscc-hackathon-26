version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nscc-hackathon-backend
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -c "python create_db.py && exec python main.py"
    stop_grace_period: 3s

  nginx:
    image: nginx:alpine
    container_name: nscc-hackathon-nginx
    ports:
      - "9000:9000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    stop_grace_period: 3s

networks:
  default:
    name: nscc-hackathon-network
