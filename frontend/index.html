<body>
    <div class="main-title"><h1>IT Campus Class Availability</h1></div>
<main>
    <div class="class-list">
        <div class="scrollable-list" id="room-list">
                <ul>
                    <li class="roomNum">D327<a href="#" class="schedule-link">See Schedule</a></li>
                    <li class="roomNum">D327<a href="#" class="schedule-link">See Schedule</a></li>

                </ul>
        </div>
    </div>
    <div class="filters">
    <div class="filter-items"><label for="wing">Choose a Wing of the building:</label>
        <select id="wings" name="wing">
            <option value="D Wing">D Wing</option>
            <option value="C Wing">C Wing</option>
            <option value="B Wing">B Wing</option>
            <option value="A Wing">A Wing</option>
        </select>
        </div>
    <div class="filter-items"><label for="room-type">Choose type of room:</label>
        <select id="roomType" name="room=type">
            <option value="Computer Lab">Computer Lab</option>
            <option value="Lecture Room">Lecture Room</option>
            <option value="Study Room">Study Room</option>
            <option value="Science Lab">Science Lab</option>
        </select>
        </div>
    <div class="filter-items"><label for="floor">Choose the floor:</label>
        <select id="level" name="floor">
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
        </select>
        </div>
    </div>
