<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Room Availability at NSCC IT Campus</title>
</head>

<body>
    <header>
        <h1 id="main-title">Room Availability at NSCC IT Campus</h1>
    </header>
    <main>
        <h2 id="page-title">Room Selector</h2>

        <div class="flex">
            <section id="room-list">
                <h4>Room List</h4>
                <div class="scrollable-list">
                    <ul>
                        <li class="room-not-found">Loading...</li>
                    </ul>
                </div>
            </section>

            <section id="room-filters">
                <h4>Filters</h4>
                <div class="filter">
                    <label for="room-type">Room Type:</label>
                    <select id="room-type" name="room-type">
                        <option value="classroom">Classroom</option>
                        <option value="computer_classroom">Computer Classroom</option>
                        <option value="network_computer_classroom">Computer Classroom (networking)</option>
                        <option value="lab_classroom">Lab Classroom</option>
                        <option value="project_room">Student Project Room</option>
                    </select>
                </div>
                <div class="filter">
                    <label for="building-wing">Building Wing:</label>
                    <select id="building-wing" name="building-wing">
                        <option value="">Any</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
                <div class="filter">
                    <label for="building-floor">Building Floor:</label>
                    <select id="building-floor" name="building-floor">
                        <option value="">Any</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <!-- TODO -->
    </footer>

    <script src="./main.js"></script>
</body>
</html>
